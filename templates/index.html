<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student API Interface</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }
        button {
            padding: 8px 14px;
            margin: 5px;
            cursor: pointer;
        }
        input { padding: 8px; }
        #result, #academicResult, #studentList, #sectionResults,
        #myRecords, #classmateRecords, #recordDetails {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #cccccc;
        }
        .record-row { padding: 10px 0; border-bottom: 1px solid #ddd; }
        .record-row:last-child { border-bottom: 0; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 560px; }
        .form-grid label { display: grid; gap: 4px; }
        .form-actions { margin-top: 8px; }
        .status { min-height: 1.5em; }
        @media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <h1>Student API Interface</h1>
    <button onclick="loadStudent()">Load Student Information</button>
    <div id="result"></div>

    <hr>
    <h2>Greeting API</h2>
    <input type="text" id="nameInput" placeholder="Enter your first name">
    <button onclick="sayHello()">Say Hello</button>
    <p id="greeting"></p>

    <hr>
    <h2>Academic Profile API</h2>
    <button onclick="loadAcademic()">Load Academic Profile</button>
    <div id="academicResult"></div>

    <hr>
    <h2>Students from Database</h2>
    <button onclick="loadStudents()">Load Students</button>
    <div id="studentList"></div>

    <hr>
    <h2>Students by Section</h2>
    <label for="sectionInput">Choose a section:</label>
    <select id="sectionInput">
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
    </select>
    <button onclick="loadStudentsBySection()">Load Section</button>
    <div id="sectionResults"></div>

    <hr>
    <h2>My Records</h2>
    <p>Create, search, view, edit, or delete your local practice records.</p>
    <form id="studentForm" class="form-grid">
        <label>Student ID<input id="crudStudentId" name="student_id" required></label>
        <label>Name<input id="crudName" name="name" required></label>
        <label>Program<input id="crudProgram" name="program" required></label>
        <label>Year<input id="crudYear" name="year" type="number" min="1" required></label>
        <label>Section<input id="crudSection" name="section" required></label>
        <div class="form-actions">
            <button id="saveStudentButton" type="submit">Add Student</button>
            <button id="cancelEditButton" type="button" hidden>Cancel Edit</button>
        </div>
    </form>
    <p id="crudStatus" class="status" aria-live="polite"></p>
    <label for="recordSearch">Search my records</label>
    <input id="recordSearch" type="search" placeholder="Search by ID, name, program, year, or section">
    <div id="myRecords"></div>
    <div id="recordDetails" hidden></div>

    <hr>
    <h2>Classmate's Records</h2>
    <p>Read-only: enter your classmate's public student-list URL, such as <code>/api/students</code> or <code>/students</code>.</p>
    <label for="classmateUrl">Classmate API URL</label>
    <input id="classmateUrl" type="url" placeholder="https://classmate-app.onrender.com/students" style="width: min(100%, 560px)">
    <button id="loadClassmateButton" type="button">Load Classmate Records</button>
    <p id="classmateStatus" class="status" aria-live="polite"></p>
    <div id="classmateRecords"></div>
    <div id="remoteRecordDetails" hidden></div>

    <script>
        let currentStudents = [];
        let editingStudentId = null;
        let classmateStudents = [];

        function showStudentRecords(containerId, students) {
            const container = document.getElementById(containerId);
            container.replaceChildren();
            if (students.length === 0) {
                container.textContent = 'No students found.';
                return;
            }

            students.forEach(student => {
                const record = document.createElement('p');
                const studentId = document.createElement('b');
                studentId.textContent = student.student_id;
                record.append(studentId, document.createTextNode(
                    ' - ' + student.name + ' | ' + student.program +
                    ' | Year ' + student.year + ' | Section ' + student.section
                ));
                container.appendChild(record);
            });
        }

        function loadStudents() {
            fetch('/students')
                .then(response => {
                    if (!response.ok) throw new Error('Request failed');
                    return response.json();
                })
                .then(data => showStudentRecords('studentList', data))
                .catch(error => {
                    document.getElementById('studentList').textContent =
                        'Unable to retrieve student records.';
                });
        }

        function studentFromForm() {
            return {
                student_id: document.getElementById('crudStudentId').value.trim(),
                name: document.getElementById('crudName').value.trim(),
                program: document.getElementById('crudProgram').value.trim(),
                year: Number(document.getElementById('crudYear').value),
                section: document.getElementById('crudSection').value.trim()
            };
        }

        async function refreshMyRecords() {
            const response = await fetch('/api/students');
            if (!response.ok) throw new Error('Could not load your records.');
            currentStudents = await response.json();
            renderMyRecords();
        }

        function renderMyRecords() {
            const query = document.getElementById('recordSearch').value.trim().toLowerCase();
            const records = currentStudents.filter(student =>
                Object.values(student).some(value => String(value).toLowerCase().includes(query))
            );
            const container = document.getElementById('myRecords');
            container.replaceChildren();
            if (records.length === 0) {
                container.textContent = 'No matching records.';
                return;
            }

            records.forEach(student => {
                const row = document.createElement('div');
                row.className = 'record-row';
                const summary = document.createElement('p');
                summary.textContent = `${student.student_id} - ${student.name} | ${student.program} | Year ${student.year} | Section ${student.section}`;
                row.appendChild(summary);

                const detailsButton = document.createElement('button');
                detailsButton.type = 'button';
                detailsButton.textContent = 'View Details';
                detailsButton.addEventListener('click', () => showDetails('recordDetails', student));
                row.appendChild(detailsButton);

                const editButton = document.createElement('button');
                editButton.type = 'button';
                editButton.textContent = 'Edit';
                editButton.addEventListener('click', () => beginEdit(student));
                row.appendChild(editButton);

                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.textContent = 'Delete';
                deleteButton.addEventListener('click', () => deleteStudent(student.id));
                row.appendChild(deleteButton);
                container.appendChild(row);
            });
        }

        function showDetails(containerId, student) {
            const container = document.getElementById(containerId);
            container.replaceChildren();
            const heading = document.createElement('h3');
            heading.textContent = 'Student details';
            container.appendChild(heading);
            Object.entries(student).forEach(([key, value]) => {
                const item = document.createElement('p');
                const label = document.createElement('b');
                label.textContent = `${key.replaceAll('_', ' ')}: `;
                item.append(label, document.createTextNode(String(value)));
                container.appendChild(item);
            });
            container.hidden = false;
        }

        function beginEdit(student) {
            editingStudentId = student.id;
            document.getElementById('crudStudentId').value = student.student_id;
            document.getElementById('crudName').value = student.name;
            document.getElementById('crudProgram').value = student.program;
            document.getElementById('crudYear').value = student.year;
            document.getElementById('crudSection').value = student.section;
            document.getElementById('saveStudentButton').textContent = 'Save Changes';
            document.getElementById('cancelEditButton').hidden = false;
            document.getElementById('crudStatus').textContent = `Editing record ${student.id}.`;
        }

        function resetStudentForm() {
            editingStudentId = null;
            document.getElementById('studentForm').reset();
            document.getElementById('saveStudentButton').textContent = 'Add Student';
            document.getElementById('cancelEditButton').hidden = true;
        }

        document.getElementById('studentForm').addEventListener('submit', async event => {
            event.preventDefault();
            const status = document.getElementById('crudStatus');
            const isEditing = editingStudentId !== null;
            status.textContent = isEditing ? 'Saving changes...' : 'Adding student...';
            try {
                const response = await fetch(isEditing ? `/api/students/${editingStudentId}` : '/api/students', {
                    method: isEditing ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(studentFromForm())
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Request failed.');
                status.textContent = data.message;
                resetStudentForm();
                await refreshMyRecords();
            } catch (error) {
                status.textContent = error.message;
            }
        });

        async function deleteStudent(studentId) {
            if (!confirm('Delete this practice record?')) return;
            const status = document.getElementById('crudStatus');
            try {
                const response = await fetch(`/api/students/${studentId}`, { method: 'DELETE' });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Delete failed.');
                status.textContent = data.message;
                await refreshMyRecords();
                document.getElementById('recordDetails').hidden = true;
            } catch (error) {
                status.textContent = error.message;
            }
        }

        async function loadClassmateRecords() {
            const url = document.getElementById('classmateUrl').value.trim();
            const status = document.getElementById('classmateStatus');
            const container = document.getElementById('classmateRecords');
            if (!url) {
                status.textContent = 'Enter your classmate’s public API URL.';
                return;
            }
            status.textContent = 'Loading classmate records...';
            container.replaceChildren();
            try {
                let response;
                let data;
                try {
                    response = await fetch(url);
                    if (!response.ok) throw new Error(`Request failed with status ${response.status}.`);
                    data = await response.json();
                } catch (directError) {
                    status.textContent = 'Direct request blocked or unavailable; retrying through Flask...';
                    response = await fetch('/api/classmate?url=' + encodeURIComponent(url));
                    const proxyData = await response.json();
                    if (!response.ok) throw new Error(proxyData.error || 'Proxy request failed.');
                    data = proxyData;
                }
                if (!Array.isArray(data)) throw new Error('The API response must be a JSON list.');
                classmateStudents = data;
                status.textContent = `Loaded ${data.length} read-only classmate record(s).`;
                data.forEach(student => {
                    const row = document.createElement('div');
                    row.className = 'record-row';
                    const summary = document.createElement('p');
                    summary.textContent = `${student.student_id ?? ''} - ${student.name ?? ''} | ${student.program ?? ''} | Year ${student.year ?? ''} | Section ${student.section ?? ''}`;
                    const detailsButton = document.createElement('button');
                    detailsButton.type = 'button';
                    detailsButton.textContent = 'View Details';
                    detailsButton.addEventListener('click', () => showDetails('remoteRecordDetails', student));
                    row.append(summary, detailsButton);
                    container.appendChild(row);
                });
                if (data.length === 0) container.textContent = 'No records returned.';
            } catch (error) {
                status.textContent = `${error.message} If the browser blocks cross-origin access, the classmate API needs a Flask proxy.`;
            }
        }

        document.getElementById('recordSearch').addEventListener('input', renderMyRecords);
        document.getElementById('cancelEditButton').addEventListener('click', () => {
            resetStudentForm();
            document.getElementById('crudStatus').textContent = 'Edit cancelled.';
        });
        document.getElementById('loadClassmateButton').addEventListener('click', loadClassmateRecords);
        refreshMyRecords().catch(error => {
            document.getElementById('myRecords').textContent = error.message;
        });

        function loadStudentsBySection() {
            const section = document.getElementById('sectionInput').value;
            fetch('/students/section/' + encodeURIComponent(section))
                .then(response => {
                    if (!response.ok) throw new Error('Request failed');
                    return response.json();
                })
                .then(data => showStudentRecords('sectionResults', data))
                .catch(error => {
                    document.getElementById('sectionResults').textContent =
                        'Unable to retrieve students for this section.';
                });
        }

        function loadStudent() {
            fetch('/student')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').innerHTML =
                        '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                        '<p><b>Name:</b> ' + data.name + '</p>' +
                        '<p><b>Program:</b> ' + data.program + '</p>' +
                        '<p><b>Year:</b> ' + data.year + '</p>' +
                        '<p><b>Section:</b> ' + data.section + '</p>';
                })
                .catch(error => {
                    document.getElementById('result').innerHTML =
                        '<p>Unable to retrieve data.</p>';
                });
        }

        function sayHello() {
            const name = document.getElementById('nameInput').value;
            fetch('/hello?name=' + encodeURIComponent(name))
                .then(response => response.json())
                .then(data => {
                    document.getElementById('greeting').innerText = data.message;
                })
                .catch(error => {
                    document.getElementById('greeting').innerText =
                        'Unable to retrieve greeting.';
                });
        }

        function loadAcademic() {
            fetch('/academic')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('academicResult').innerHTML =
                        '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                        '<p><b>Name:</b> ' + data.name + '</p>' +
                        '<p><b>Program:</b> ' + data.program + '</p>' +
                        '<p><b>Year:</b> ' + data.year + '</p>' +
                        '<p><b>Section:</b> ' + data.section + '</p>';
                })
                .catch(error => {
                    document.getElementById('academicResult').innerText =
                        'Unable to retrieve academic profile.';
                });
        }
    </script>
</body>
</html>
